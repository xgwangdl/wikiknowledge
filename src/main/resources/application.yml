spring:
  application:
    name: wikiknowledge
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wikiknowledge}
    username: ${DB_USERNAME:wikiknowledge}
    password: ${DB_PASSWORD:wikiknowledge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET:wikiknowledge-dev-secret-key-change-me-2026-0123456789}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  storage:
    root: ${STORAGE_ROOT:./data}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
