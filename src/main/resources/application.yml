spring:
  application:
    name: wikiknowledge
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wikiknowledge}
    username: ${DB_USERNAME:wikiknowledge}
    password: ${DB_PASSWORD:wikiknowledge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
